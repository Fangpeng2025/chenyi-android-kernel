<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨翼Agent - 您的智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .logo-icon {
            font-size: 80px;
        }
        
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .tagline {
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            margin-bottom: 40px;
        }
        
        .features {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
        }
        
        .feature-item {
            color: white;
            padding: 10px 0;
            font-size: 16px;
        }
        
        .feature-item::before {
            content: "✓ ";
            color: #4ade80;
            font-weight: bold;
        }
        
        .download-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .download-title {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .version-info {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
        
        .loading {
            color: #999;
        }
        
        .footer {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 40px;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🤖</div>
        </div>
        
        <h1>晨翼Agent</h1>
        <p class="tagline">您的智能助手，随时随地为您服务</p>
        
        <div class="features">
            <div class="feature-item">Rust 内核 - 高性能稳定运行</div>
            <div class="feature-item">智谱AI - 智能对话理解</div>
            <div class="feature-item">Peekaboo 技能 - 屏幕自动化</div>
            <div class="feature-item">OCR 识别 - 文字提取与点击</div>
            <div class="feature-item">Material Design 3 - 现代化界面</div>
        </div>
        
        <div class="download-section">
            <h2 class="download-title">下载 Android 版</h2>
            <a href="https://oneapi.xintiandi.online/chenyi-agent/chenyi-agent-latest.apk" class="download-btn">
                📱 下载 APK
            </a>
            <a href="https://github.com/Fangpeng2025/chenyi-android-kernel/releases/latest" class="download-btn" style="background: linear-gradient(135deg, #333 0%, #555 100%);">
                🔗 GitHub Release
            </a>
            <p class="version-info" id="version-info">
                <span class="loading">正在获取版本信息...</span>
            </p>
        </div>
        
        <div class="footer">
            <p>© 2026 晨翼Agent | <a href="https://github.com/Fangpeng2025/chenyi-android-kernel">GitHub</a></p>
        </div>
    </div>
    
    <script>
        // 从 version.json 读取版本信息
        fetch('https://oneapi.xintiandi.online/chenyi-agent/version.json')
            .then(response => response.json())
            .then(data => {
                const versionInfo = document.getElementById('version-info');
                versionInfo.innerHTML = `当前版本: v${data.versionName} | 大小: 19 MB`;
                
                // 如果有更新日志，可以显示
                if (data.updateLog) {
                    console.log('更新日志:', data.updateLog);
                }
            })
            .catch(error => {
                console.error('获取版本信息失败:', error);
                const versionInfo = document.getElementById('version-info');
                versionInfo.innerHTML = '当前版本: 最新版 | 大小: 19 MB';
            });
    </script>
</body>
</html>
