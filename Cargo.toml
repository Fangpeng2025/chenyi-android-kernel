[package]
name = "chenyi-kernel"
version = "0.1.0"
edition = "2021"
description = "晨翼Agent Android 内核 - 基于 Rust 的高性能 AI Agent 内核"
authors = ["ChenYi Team"]
license = "MIT"

[lib]
name = "chenyi"
crate-type = ["cdylib", "rlib"]

[features]
default = []
android = ["jni", "ndk"]

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 并发
parking_lot = "0.12"
once_cell = "1.19"

# 错误处理
anyhow = "1"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# 存储
rusqlite = { version = "0.37", features = ["bundled"] }

# HTTP 客户端（用于 LLM API）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Android JNI
jni = { version = "0.21", optional = true }
ndk = { version = "0.9", optional = true }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
