name: Deploy Update to Server

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.17)'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: chenyi-agent-release
          path: ./apk
      
      - name: Get Version Info
        id: version
        run: |
          # 从 APK 文件名或 build.gradle.kts 获取版本信息
          VERSION_NAME=$(grep "versionName" android/app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle.kts | head -1 | cut -d'=' -f2 | tr -d ' ')
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
      
      - name: Generate version.json
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          BUILD_DATE=$(date +%Y-%m-%d)
          
          # 获取 APK 文件大小
          APK_PATH=$(find ./apk -name "*.apk" | head -1)
          APK_SIZE=$(stat -c%s "$APK_PATH")
          
          cat > version.json << EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "releaseNotes": "【v$VERSION_NAME 更新内容】\\n\\n✨ 新功能\\n• 自动更新功能优化\\n\\n🔧 技术改进\\n• 性能优化\\n• Bug 修复",
            "minAndroidVersion": 21,
            "apkSize": $APK_SIZE,
            "downloadUrl": "https://oneapi.xintiandi.online/chenyi-agent/chenyi-agent-release.apk",
            "forceUpdate": false,
            "buildDate": "$BUILD_DATE",
            "githubRelease": "https://github.com/Fangpeng2025/chenyi-android-kernel/releases/tag/v$VERSION_NAME"
          }
          EOF
          
          echo "Generated version.json:"
          cat version.json
      
      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "version.json,apk/*.apk"
          target: "/var/www/chenyi-agent"
          strip_components: 1
          
      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."
          
          # 检查 version.json
          echo "Checking version.json..."
          curl -s https://oneapi.xintiandi.online/chenyi-agent/version.json | jq .
          
          # 检查 APK
          echo ""
          echo "Checking APK..."
          curl -sI https://oneapi.xintiandi.online/chenyi-agent/chenyi-agent-release.apk | grep -E "(HTTP|Content-Length)"
      
      - name: Notify
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "Update URL: https://oneapi.xintiandi.online/chenyi-agent/"
          echo "Version: ${{ steps.version.outputs.version_name }}"
