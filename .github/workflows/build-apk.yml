name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager "ndk;25.2.9519653" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_TOOLCHAIN=$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Add NDK to PATH
        run: |
          echo "$NDK_TOOLCHAIN/bin" >> $GITHUB_PATH

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Rust Kernel (arm64-v8a)
        env:
          CC_aarch64-linux-android: aarch64-linux-android29-clang
          AR_aarch64-linux-android: llvm-ar
        run: |
          cargo build --release --target aarch64-linux-android --features android

      - name: Build Rust Kernel (armeabi-v7a)
        env:
          CC_armv7-linux-androideabi: armv7a-linux-androideabi29-clang
          AR_armv7-linux-androideabi: llvm-ar
        run: |
          cargo build --release --target armv7-linux-androideabi --features android

      - name: Build Rust Kernel (x86_64)
        env:
          CC_x86_64-linux-android: x86_64-linux-android29-clang
          AR_x86_64-linux-android: llvm-ar
        run: |
          cargo build --release --target x86_64-linux-android --features android

      - name: Build Rust Kernel (x86)
        env:
          CC_i686-linux-android: i686-linux-android29-clang
          AR_i686-linux-android: llvm-ar
        run: |
          cargo build --release --target i686-linux-android --features android

      - name: Copy Native Libraries
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          mkdir -p android/app/src/main/jniLibs/x86
          
          cp target/aarch64-linux-android/release/libchenyi.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libchenyi.so android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libchenyi.so android/app/src/main/jniLibs/x86_64/
          cp target/i686-linux-android/release/libchenyi.so android/app/src/main/jniLibs/x86/
          
          ls -la android/app/src/main/jniLibs/*/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon

      - name: Decode Keystore
        working-directory: android/app
        run: |
          # 从 GitHub Secrets 恢复 keystore
          # 如果没有 secrets.KEYSTORE_BASE64，则生成一个新的固定 keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > chenyi-release.keystore
          else
            echo "Generating new keystore (will be added to Secrets later)"
            keytool -genkeypair -v \
              -keystore chenyi-release.keystore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias chenyi-agent \
              -storepass chenyi2026agent \
              -keypass chenyi2026agent \
              -dname "CN=ChenYi Agent, OU=Development, O=ChenYi Team, L=Zhengzhou, ST=Henan, C=CN"
            
            # 保存 keystore 的 base64 编码，方便上传到 Secrets
            echo "KEYSTORE_BASE64=$(base64 -w 0 chenyi-release.keystore)" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Generated new keystore. Please upload KEYSTORE_BASE64 to GitHub Secrets!"
          fi
          
          ls -la chenyi-release.keystore

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'chenyi2026agent' }}
          KEY_ALIAS: chenyi-agent
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'chenyi2026agent' }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=chenyi-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chenyi-agent-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chenyi-agent-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}