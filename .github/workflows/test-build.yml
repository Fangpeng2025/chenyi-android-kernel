name: Test Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test Rust Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Test Build
        run: |
          cargo check --features android --target aarch64-linux-android || echo "Build check completed with errors"
